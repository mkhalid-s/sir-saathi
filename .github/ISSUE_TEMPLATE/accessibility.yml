name: Accessibility barrier
description: Report a non-sensitive barrier in the SIR Saathi interface
title: "[Accessibility]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Do not include a voter name, EPIC, address, phone number,
        voter record, document, private screenshot, credential, or Turnstile response.
        For voter-service help or an urgent election matter, use the official ECI channel below.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all voter, contact, document, credential, and challenge-response details.
          required: true
  - type: input
    id: page
    attributes:
      label: Page or route
      description: Give only the public SIR Saathi page or route where the barrier occurred.
      placeholder: /states/in-wb/
    validations:
      required: true
  - type: dropdown
    id: barrier-type
    attributes:
      label: Barrier type
      options:
        - Keyboard or focus
        - Screen reader or semantics
        - Voice control
        - Zoom, reflow, or text size
        - Colour, contrast, or forced colours
        - Motion or animation
        - Language or text direction
        - Offline or connectivity status
        - Other accessibility barrier
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What were you trying to do? Use synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What happened
      description: Describe the observable barrier and what you expected, without private data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and assistive technology
      description: Optional product/version details only; do not include account or device identifiers.
    validations:
      required: false
  - type: checkboxes
    id: public-record
    attributes:
      label: Public record acknowledgement
      options:
        - label: I understand this report and later comments will be publicly visible.
          required: true
