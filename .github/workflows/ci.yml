name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock pytest==9.0.2
      - name: Sensitive-data scan
        run: python scripts/check_sensitive.py
      - name: Python tests
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest
      - name: Parser smoke compile
        run: python -m py_compile pipeline/parse_2002.py pipeline/transliterate.py
      - name: Transliteration smoke test
        run: python pipeline/transliterate.py --test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install web dependencies
        run: npm ci
      - name: Verify generated PWA icons
        run: npm run pwa:icons:check
      - name: Build web PWA
        run: ASTRO_TELEMETRY_DISABLED=1 npm run web:build
      - name: Verify complete offline asset precache
        run: npm run pwa:offline:check
      - name: Audit generated accessibility structure
        run: python scripts/check_accessibility.py
      - name: Audit generated discoverability metadata
        run: python scripts/check_discoverability.py
      - name: Launch gate
        run: python scripts/launch_gate.py
      - name: Slice gate
        run: python scripts/slice_gate.py

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sir_saathi_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sir-saathi-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sir_saathi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Apply and exercise the schema without voter data
        env:
          SIR_SAATHI_DATABASE_URL: postgresql://postgres:sir-saathi-ci-only@127.0.0.1:5432/sir_saathi_ci
        run: python scripts/check_postgres_integration.py
