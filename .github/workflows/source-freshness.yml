name: Official source freshness

on:
  schedule:
    # 08:47 IST. Avoid the top of the hour, when scheduled runs are most likely to queue.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-source-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Check official source freshness
        run: |
          set -o pipefail
          python -m pipeline.sir_saathi_pipeline.source_freshness \
            --fail-on-stale \
            | tee source-freshness-report.json
      - name: Retain the non-sensitive freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-freshness-${{ github.run_id }}
          path: source-freshness-report.json
          if-no-files-found: error
          retention-days: 30
